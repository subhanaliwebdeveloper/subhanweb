<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <title>Subhan Ali — Full Stack Web & Mobile App Developer</title>
    <meta name="description" content="Portfolio of Subhan Ali, a full stack web and mobile app developer based in Faisalabad, Pakistan. Clean, functional code, modern React applications, and responsive mobile interfaces." />
    <meta name="author" content="Subhan Ali" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Subhan Ali — Full Stack Web & Mobile App Developer" />
    <meta property="og:description" content="Portfolio of Subhan Ali, a full stack web and mobile app developer based in Faisalabad, Pakistan." />
    <meta property="og:image" content="/images/profile.jpg" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Subhan Ali — Full Stack Web & Mobile App Developer" />
    <meta name="twitter:description" content="Building clean, reliable web applications and cross-platform mobile interfaces." />
    <meta name="twitter:image" content="/images/profile.jpg" />

    <!-- Google Fonts: Poppins (Clean modern sans-serif with bold heading weights) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&display=swap" rel="stylesheet" />

    <!-- Early theme init to prevent FOUC -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme-preference');
          var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved || (systemDark ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
